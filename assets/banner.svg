<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 320"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".6"/><stop offset="100%" stop-color="#3b82f6" stop-opacity=".1"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes floatCircle{0%{transform:translateY(0) scale(1);opacity:.3}50%{transform:translateY(-15px) scale(1.08);opacity:.6}}@keyframes pulseGlow{0%{opacity:.2;transform:scale(.98)}50%{opacity:.5;transform:scale(1.02)}}@keyframes dashFlow{0%{stroke-dashoffset:100}}.subtitle,.tag,.title{font-family:system-ui,-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,sans-serif}.title{font-weight:800;font-size:38px;fill:url(#titleGrad)}.subtitle{font-weight:500;font-size:18px;fill:#cbd5e1}.tag{font-weight:600;font-size:13px;fill:#38bdf8}.anim-circle-1{animation:floatCircle 6s ease-in-out infinite}.anim-circle-2{animation:floatCircle 8s ease-in-out infinite 1s}.anim-glow{animation:pulseGlow 4s ease-in-out infinite;transform-origin:center}.anim-flow{stroke-dasharray:10 15;animation:dashFlow 20s linear infinite}</style></defs><rect width="1200" height="320" fill="url(#bgGrad)" rx="16"/><path stroke="#334155" stroke-opacity=".25" stroke-width="1" d="M 0 80 H 1200 M 0 160 H 1200 M 0 240 H 1200 M 200 0 V 320 M 400 0 V 320 M 600 0 V 320 M 800 0 V 320 M 1000 0 V 320"/><path fill="none" stroke="#38bdf8" stroke-width="2" d="M 50 260 Q 250 180 450 240 T 850 200 T 1150 250" class="anim-glow" opacity=".3"/><path fill="none" stroke="#818cf8" stroke-width="2" d="M 50 270 Q 300 210 550 260 T 950 210 T 1150 270" class="anim-flow" opacity=".4"/><g opacity=".8" transform="translate(850, 45)"><rect width="310" height="80" x="-10" y="-10" fill="#1e293b" fill-opacity=".6" stroke="#475569" stroke-width="1" rx="12"/><path fill="none" stroke="#06b6d4" stroke-width="2.5" d="M 0 30 L 40 30 L 50 10 L 65 55 L 80 5 L 95 40 L 105 30 L 160 30 L 170 15 L 180 45 L 190 30 L 290 30" filter="url(#glow)"/><circle cx="95" cy="40" r="4" fill="#38bdf8" class="anim-circle-1"/></g><g transform="translate(850, 220)"><rect width="130" height="34" x="0" y="0" fill="url(#accentGrad)" stroke="#38bdf8" stroke-width="1" rx="17"/><text x="65" y="21" class="tag" text-anchor="middle">ePRO / eCOA 📱</text></g><g transform="translate(995, 220)"><rect width="145" height="34" x="0" y="0" fill="url(#accentGrad)" stroke="#818cf8" stroke-width="1" rx="17"/><text x="72" y="21" class="tag" text-anchor="middle">Decentralized 🌐</text></g><circle cx="90" cy="90" r="45" fill="#38bdf8" class="anim-circle-1" opacity=".08"/><circle cx="1100" cy="140" r="65" fill="#c084fc" class="anim-circle-2" opacity=".06"/><g transform="translate(60, 110)"><rect width="280" height="28" x="0" y="-35" fill="#1e293b" stroke="#0284c7" stroke-width="1" rx="14"/><text x="14" y="-16" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="1">CLINICAL TRIALS ECOSYSTEM 🧪</text><text x="0" y="30" class="title">Awesome Patient Engagement</text><text x="0" y="70" class="title" font-size="32">in Clinical Trials 🏥</text><text x="0" y="115" class="subtitle">A curated list of top SaaS platforms, ePRO/eCOA software &amp; open-source projects</text><text x="0" y="140" fill="#94a3b8" class="subtitle" font-size="15">Accelerating trial recruitment, participant retention &amp; remote monitoring</text></g></svg>