<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 38px; fill: url(#titleGrad); }
      .subtitle { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 18px; fill: #cbd5e1; }
      .tag { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; }
      
      /* Dynamic pulses and animated elements placed strictly around/behind, away from text core */
      @keyframes floatCircle {
        0% { transform: translateY(0px) scale(1); opacity: 0.3; }
        50% { transform: translateY(-15px) scale(1.08); opacity: 0.6; }
        100% { transform: translateY(0px) scale(1); opacity: 0.3; }
      }
      @keyframes pulseGlow {
        0% { opacity: 0.2; transform: scale(0.98); }
        50% { opacity: 0.5; transform: scale(1.02); }
        100% { opacity: 0.2; transform: scale(0.98); }
      }
      @keyframes dashFlow {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }
      .anim-circle-1 { animation: floatCircle 6s ease-in-out infinite; }
      .anim-circle-2 { animation: floatCircle 8s ease-in-out infinite 1s; }
      .anim-glow { animation: pulseGlow 4s ease-in-out infinite; transform-origin: center; }
      .anim-flow { stroke-dasharray: 10 15; animation: dashFlow 20s linear infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid lines -->
  <path d="M 0 80 H 1200 M 0 160 H 1200 M 0 240 H 1200 M 200 0 V 320 M 400 0 V 320 M 600 0 V 320 M 800 0 V 320 M 1000 0 V 320" stroke="#334155" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Dynamic background wave graphs (strictly low opacity, behind text) -->
  <path class="anim-glow" d="M 50 260 Q 250 180 450 240 T 850 200 T 1150 250" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3"/>
  <path class="anim-flow" d="M 50 270 Q 300 210 550 260 T 950 210 T 1150 270" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.4"/>

  <!-- Top Right Dynamic Heartbeat / ECG Line -->
  <g transform="translate(850, 45)" opacity="0.8">
    <rect x="-10" y="-10" width="310" height="80" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-width="1"/>
    <path d="M 0 30 L 40 30 L 50 10 L 65 55 L 80 5 L 95 40 L 105 30 L 160 30 L 170 15 L 180 45 L 190 30 L 290 30" fill="none" stroke="#06b6d4" stroke-width="2.5" filter="url(#glow)"/>
    <circle cx="95" cy="40" r="4" fill="#38bdf8" class="anim-circle-1"/>
  </g>

  <!-- Bottom Decorative Badges / Pills (Placed at edges) -->
  <g transform="translate(850, 220)">
    <rect x="0" y="0" width="130" height="34" rx="17" fill="url(#accentGrad)" stroke="#38bdf8" stroke-width="1"/>
    <text x="65" y="21" text-anchor="middle" class="tag">ePRO / eCOA 📱</text>
  </g>
  <g transform="translate(995, 220)">
    <rect x="0" y="0" width="145" height="34" rx="17" fill="url(#accentGrad)" stroke="#818cf8" stroke-width="1"/>
    <text x="72" y="21" text-anchor="middle" class="tag">Decentralized 🌐</text>
  </g>

  <!-- Left Side Visual Accent Circles (Dynamic elements) -->
  <circle cx="90" cy="90" r="45" fill="#38bdf8" opacity="0.08" class="anim-circle-1"/>
  <circle cx="1100" cy="140" r="65" fill="#c084fc" opacity="0.06" class="anim-circle-2"/>

  <!-- Main Foreground Content (Title and Subtitle - Zero obstruction) -->
  <g transform="translate(60, 110)">
    <!-- Main Header Pill -->
    <rect x="0" y="-35" width="280" height="28" rx="14" fill="#1e293b" stroke="#0284c7" stroke-width="1"/>
    <text x="14" y="-16" font-family="sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1">CLINICAL TRIALS ECOSYSTEM 🧪</text>
    
    <!-- Title -->
    <text x="0" y="30" class="title">Awesome Patient Engagement</text>
    <text x="0" y="70" class="title" font-size="32">in Clinical Trials 🏥</text>

    <!-- Subtitle -->
    <text x="0" y="115" class="subtitle">A curated list of top SaaS platforms, ePRO/eCOA software &amp; open-source projects</text>
    <text x="0" y="140" class="subtitle" font-size="15" fill="#94a3b8">Accelerating trial recruitment, participant retention &amp; remote monitoring</text>
  </g>
</svg>
